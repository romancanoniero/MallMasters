<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mall Masters Visitor</title><style>body{margin:0;background:#091422;color:#e2f4ff;font-family:system-ui}header,section{padding:20px;max-width:850px;margin:auto}h1{font-size:20px;letter-spacing:3px}.map{position:relative;background:radial-gradient(#254b63,#091422 72%);border:1px solid #37667c;border-radius:22px;height:380px;overflow:hidden}svg{height:100%;width:100%}input{background:#142c40;color:white;border:1px solid #4d8297;border-radius:12px;padding:15px;width:100%;box-sizing:border-box;font-size:16px}button{background:#13354c;color:#d5faff;border:1px solid #4b8495;border-radius:12px;padding:10px;margin:3px}.active{background:#2ce0df;color:#081621}.controls{position:absolute;right:8px;top:12px;display:grid}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30566c;padding:8px}p,small{color:#abc9d7}.alert{color:#78eadd}</style></head><body><header><small>DEMO CONCEPTUAL · NO REPRESENTA PLANOS REALES</small><h1>MALL MASTERS</h1><h2>ION Orchard · Visitor</h2><p>Explorá plantas, buscá locales de ejemplo y visualizá rutas ilustrativas.</p></header><section><div class="map"><svg viewBox="0 0 480 360" id="scene"></svg><div class="controls" id="levels"></div></div><p><button id="all" class="active">Todas</button><button id="clear">Borrar ruta</button></p></section><section><input id="query" placeholder="Buscar locales y servicios…"><div class="list" id="results"></div><p class="alert" id="route">Seleccioná un destino para explorar la ruta.</p><small>La versión actual es un prototipo visual y no utiliza geolocalización ni mapas reales.</small></section><script>
const ns="http://www.w3.org/2000/svg",data=[["Moda",2,173,112],["Tecnología",2,305,120],["Café",1,170,190],["Equipaje",1,315,191],["Servicios",0,175,264],["Belleza",0,310,270]];let floor=null,destination=null;
const el=id=>document.getElementById(id);
function shape(parent,tag,attrs,t){let e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(t!==undefined)e.textContent=t;parent.appendChild(e);return e}
function draw(){let s=el("scene");s.replaceChildren();for(let i=0;i<3;i++){if(floor!==null&&floor!==i)continue;let y=280-i*80;shape(s,"polygon",{points:`75,${y-35} 235,${y-94} 405,${y-35} 235,${y+29}`,fill:i%2?"#17384e":"#21465c",stroke:"#4dbcc8","stroke-width":"2"});shape(s,"polygon",{points:`75,${y-35} 235,${y+29} 235,${y+43} 75,${y-21}`,fill:"#102b40",stroke:"#4dbcc8"});shape(s,"text",{x:32,y:y-25,fill:"#c5ebf4","font-size":"16"},`L${i}`)}
data.forEach((d,idx)=>{if(floor!==null&&floor!==d[1])return;shape(s,"circle",{cx:d[2],cy:d[3],r:destination===idx?11:6,fill:destination===idx?"#ffbf63":"#5be7d9"});if(destination===idx)shape(s,"text",{x:d[2]+15,y:d[3]-8,fill:"#fff","font-size":"15"},d[0])});
if(destination!==null){let d=data[destination];shape(s,"polyline",{points:`235,326 235,${d[3]+45} ${d[2]},${d[3]}`,fill:"none",stroke:"#ffd277","stroke-width":"4","stroke-dasharray":"8 5"});el("route").textContent=`Ruta de demostración: entrada → planta L${d[1]} → ${d[0]}. Aún no se calculan rutas reales.`}
el("levels").replaceChildren();for(let i=2;i>=0;i--){let b=document.createElement("button");b.textContent="L"+i;b.className=floor===i?"active":"";b.onclick=()=>{floor=floor===i?null:i;draw()};el("levels").appendChild(b)}el("all").className=floor===null?"active":"";results()}
function results(){el("results").replaceChildren();let q=el("query").value.toLowerCase();data.forEach((d,i)=>{if((floor!==null&&floor!==d[1])||!d[0].toLowerCase().includes(q))return;let row=document.createElement("div");row.className="item";let label=document.createElement("span");label.textContent=d[0]+" · L"+d[1];let btn=document.createElement("button");btn.textContent="Ir";btn.onclick=()=>{destination=i;floor=d[1];draw()};row.append(label,btn);el("results").appendChild(row)})}
el("query").oninput=results;el("all").onclick=()=>{floor=null;draw()};el("clear").onclick=()=>{destination=null;el("route").textContent="Seleccioná un destino para explorar la ruta.";draw()};draw()
</script></body></html>
