name: MallMastersScanner
options:
  bundleIdPrefix: com.mallmasters
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MallMastersScanner:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mallmasters.scanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mall Masters Scanner
        INFOPLIST_KEY_NSCameraUsageDescription: Se utiliza la camara y LiDAR para visualizar la geometria del espacio durante el escaneo.
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
    scheme:
      testTargets: []
